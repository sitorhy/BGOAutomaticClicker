[project]
name = "main"
version = "0.1.0"
description = "训练集图片生成"
authors = [
    { name = "sitorhy", email = "sitorhy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "pillow>=12.3.0",
    "scipy>=1.16.0",
    "opencv-python>=5.0.0.93",
    "scipy-stubs~=1.18.1"
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

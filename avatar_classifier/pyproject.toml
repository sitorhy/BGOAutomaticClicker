[project]
name = "main"
version = "0.1.0"
description = "训练集图片生成"
authors = [
    { name = "sitorhy", email = "sitorhy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "pillow==13.0.0",
    "scipy>=1.16.0",
    "scipy-stubs~=1.18.1",
    "opencv-contrib-python>=5.0.0.93",
    "fastapi[standard]==0.162.0",
    "uvicorn>=0.54.0",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
    "joblib>=1.5.0",
    "torchvision>=0.29.2",
    "torch>=2.13",
    "skl2onnx>=1.20.0",
    "onnxruntime>=1.31.1",
    "onnxmltools>=1.16.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

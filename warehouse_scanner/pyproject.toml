[project]
name = "warehouse-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.1.0.95",
    "pillow>=13.0.0",
    "rapidocr-onnxruntime>=1.4.4",
